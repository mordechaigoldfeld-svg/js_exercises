<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contact.css">
    <title>Contactpage</title>
</head>

<body>
    <div class="grid-container">

        <nav class="nav-bar">

            <div class="logo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxhFPw2fXwwrNt2YkebW2D5Km-Ur0nfukaUsEh45fG8A&s=10"
                    alt="logo">
            </div>

            <div class="nav-content">

                <div class="contact-text">
                    <h1>הגינה של מיכאל
                        <span class="spinning-flower">🌷</span>
                    </h1>
                </div>


                <div class="contact-link">
                    <a href="./home.html" class="bait-link" id="b-link-c" target="_blank">בית</a>
                    <a href="./contact.html" class="bait-link"> → צור קשר</a>

                </div>

            </div>


        </nav>

        <div class="over-bord">
            <main class="main-content">

                <section class="boxes">

                    <div class="adress-container">
                        <h2>איפה אנחנו</h2>
                        <div class="adress-cards">
                            <div class="adress-card">
                                <h3>:כתובת</h3>
                                <h2>רחוב השלושה 54 תל אביב</h2>
                            </div>
                            <div class="adress-card">
                                <h3>שעות פתיחה:</h3>
                                <h2>ראשון עד חמישי מ8:00 עד 17:00</h2>
                            </div>
                            <div class="adress-card">
                                <h3>שישי :</h3>
                                <h2>מ 8:00 עד 12:00</h2>
                            </div>
                            <div class="adress-card">
                                <h3>טלפון:</h3>
                                <h2>03-12345678</h2>
                            </div>
                        </div>
                    </div>

                </section>

                <section class="boxes">
                    <form action="" method="post">
                        <div class="contact-container">

                            <h2>השאירו פרטים ונחזור אליכם</h2>

                            <div class="contact-cards">
                                <div class="contact-card">
                                    <label for="name">שם מלא:</label><br>
                                    <input type="text" id="name" required placeholder="enter yor name">
                                </div>
                                <div class="contact-card">
                                    <label for="email">אמייל:</label><br>
                                    <input type="email" id="email" required placeholder="example@gmail.com">
                                </div>
                                <div class="contact-card">
                                    <label for="question"> במה נוכל לעזור?</label><br>
                                    <select name="question" id="question">
                                        <option value="question">שאלה</option>
                                        <option value="buy">קנייה</option>
                                        <option value="problem">תקלה</option>
                                        <option value="">הזמנה</option>
                                        <option value="others">אחר</option>
                                    </select>
                                </div>
                                <div class="contact-card">
                                    <label for="content">ספר לנו קצת:</label><br>
                                    <input type="text" id="content" placeholder="נשמח לשמוע קצת עליכם!">
                                </div>
                            </div>

                            <button  type="submit" class="send">שליחת הפנייה</button>

                        </div>
                    </form>

                </section>


            </main>
        </div>
        <footer class="footer">

            <div class="footer-content">
                <div class="contact-link">
                    <a href="./home.html" class="bait-link" id="b-link-c" target="_blank">בית</a>
                    <a href="./contact.html" class="bait-link"> → צור קשר</a>

                </div>
                <div class="footer-text">
                    <p class="p-footer">הגינה של מיכל, הבית של הפרחים שלך 
                        <span class="spinning-flower">🌷</span>
                    </p>
                </div>
            </div>

        </footer>


    </div>
</body>

</html>
